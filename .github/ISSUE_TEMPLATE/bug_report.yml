name: Bug report
description: Report a reproducible problem with MindVault
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Be specific — upload which file, which settings, which provider.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, MindVault version, install method (Docker / source / package), LLM provider and model.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste structured log lines if available (no document contents, no secrets).
